[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "research-continuity-agent"
version = "1.2.0"
description = "Retrieval-first scaffolding for a research continuity agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "dmcp2003" }
]
dependencies = [
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "PyYAML>=6.0,<7.0",
  "python-dotenv>=1.0,<2.0",
  "mcp>=1.26.0",
  "chromadb>=0.6.3",
  "pypdf>=5.9.0",
  "streamlit>=1.55.0",
  "plotly>=6.6.0",
  "networkx>=3.6.1",
  "sentence-transformers>=5.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.4",
]
vector = [
  "chromadb>=0.5,<0.7"
]
pdf = [
  "pypdf>=5.0,<6.0"
]

[project.scripts]
rca-ingest = "cli.rca_ingest:main"
rca-query = "cli.rca_query:main"

[tool.hatch.build.targets.wheel]
packages = ["rca", "cli"]

[tool.pytest.ini_options]
testpaths = [
  "tests",
  "rca/mcp_servers/filesystem/tests",
  "rca/mcp_servers/experiments/tests"
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
]
ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]
