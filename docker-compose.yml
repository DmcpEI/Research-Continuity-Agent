# Research Continuity Agent — local Docker deployment
#
# Prerequisites
# -------------
# Ollama must be running on the host with both models pulled:
#   ollama pull nomic-embed-text
#   ollama pull qwen2.5:14b
#
# The container reaches host Ollama via http://host.docker.internal:11434.
# On Linux this requires the extra_hosts entry below; on Mac Docker Desktop
# host.docker.internal is available automatically.
#
# Usage
#   docker compose up --build rca   # Streamlit dev UI on :8501 (builds image on first run)
#   docker compose up --build demo  # public demo: React app + API on :8000 with a sample corpus
#   docker compose --profile demo down   # stop and remove containers (add -v to drop demo data)
#
# The demo needs `ollama pull nomic-embed-text` and `ollama pull gemma3:12b` instead.

services:
  rca:
    build: .
    ports:
      - "8501:8501"
    volumes:
      # Persist the knowledge store (SQLite graph + ChromaDB vectors) across restarts.
      # The host path is relative to this file; create it if it doesn't exist.
      - ./.rca:/app/.rca
    env_file:
      - path: .env
        required: false
    environment:
      RCA_LLM_BACKEND: ollama
      RCA_ENABLE_FILESYSTEM_TOOLS: "true"
      RCA_WORKSPACE_ROOT: /app
      RCA_FILESYSTEM_ROOT: /app
      # Override Ollama URL so the container can reach the host's Ollama process.
      # On Linux, Docker maps host-gateway → host machine IP automatically via extra_hosts.
      RCA_EMBEDDING_BASE_URL: http://host.docker.internal:11434
      RCA_LLM_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      # Needed on Linux; no-op on Mac Docker Desktop (already defined there).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  demo:
    build: .
    # Only started when named (`docker compose up demo`), so a bare `up` still runs Streamlit only.
    profiles: ["demo"]
    command: ["uv", "run", "python", "-m", "cli.rca_demo"]
    ports:
      # Localhost only: the API has no login and can delete sources.
      - "127.0.0.1:8000:8000"
    volumes:
      # Demo store, downloaded papers, and the reranker model cache; separate from ./.rca.
      - rca-demo:/app/.rca-demo
      - hf-cache:/root/.cache/huggingface
    environment:
      RCA_LLM_BACKEND: ollama
      RCA_GENERATION_MODEL: gemma3:12b
      RCA_DATA_DIR: /app/.rca-demo
      RCA_GRAPH_DB_PATH: /app/.rca-demo/graph.sqlite3
      RCA_VECTOR_DIR: /app/.rca-demo/vectors
      RCA_EVENT_LOG_PATH: /app/.rca-demo/events.jsonl
      RCA_TELEMETRY_LOG_PATH: /app/.rca-demo/telemetry.jsonl
      RCA_EXPERIMENT_DB_PATH: /app/.rca-demo/experiments.sqlite3
      # Agent file tools see only the downloaded papers, not the app source.
      RCA_ENABLE_FILESYSTEM_TOOLS: "true"
      RCA_WORKSPACE_ROOT: /app/.rca-demo/papers
      RCA_FILESYSTEM_ROOT: /app/.rca-demo/papers
      RCA_EMBEDDING_BASE_URL: http://host.docker.internal:11434
      RCA_LLM_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      # first start downloads papers and ingests them before the server is up
      start_period: 300s

volumes:
  rca-demo:
  hf-cache:
